<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Account | Rare Vision</title>
<meta name="description" content="Create your RAREVISION account for a richer, more personal shopping experience.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logos/rare-vision-logo.png">
</head>
<body>


<!-- ===================== REGISTRATION FORM ===================== -->
<main class="register-section">
  <div class="register-heading-block">
    <h1 class="showcase-heading">Welcome!</h1>
    <p class="register-subtext">Create your RAREVISION account to enjoy a richer, more personal shopping experience.</p>
  </div>

  <div class="register-card">
    <form id="registerForm" class="register-form" novalidate>

      <p class="form-error" id="registerFormError" hidden></p>
      <p class="form-success" id="registerFormSuccess" hidden></p>

      <div class="form-row two-col">
        <label for="registerFirstName">First Name *
          <input type="text" id="registerFirstName" name="firstName" required autocomplete="given-name">
        </label>
        <label for="registerLastName">Last Name *
          <input type="text" id="registerLastName" name="lastName" required autocomplete="family-name">
        </label>
      </div>

      <div class="form-row">
        <label for="registerEmail">Email *
          <input type="email" id="registerEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </label>
      </div>

      <div class="form-row">
        <label for="registerPassword">Password *
          <div class="password-field">
            <input type="password" id="registerPassword" name="password" required autocomplete="new-password" placeholder="At least 6 characters">
            <button type="button" class="password-toggle" id="registerPasswordToggle" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="icon-eye"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2"/></svg>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="icon-eye-off" hidden><path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.3 4.3M6.5 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7c1.4 0 2.6-.3 3.7-.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.9 10a3.2 3.2 0 0 0 4.2 4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </label>
      </div>

      <button type="submit" class="btn-signin" id="registerSubmitBtn">
        <span class="btn-text">Create Account</span>
        <span class="btn-spinner" hidden></span>
      </button>

      <p class="register-signin-prompt">Already have an account? <button type="button" class="link-btn" id="registerSigninTrigger">Sign In</button></p>
    </form>
  </div>
</main>

<!-- Header, footer, sign-in drawer, and toast are injected by
     js/site-common.js (loaded below) — see that file for markup. -->

<script src="js/shared.js" defer></script>
<script type="module" src="js/site-common.js"></script>
<script src="js/register.js" defer></script>
</body>
</html>
